---
name: java
on:
  push:
    branches:
      - dev
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout the code
        uses: actions/checkout@v4
      - name: setup java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: get package
        run: mvn clean package
        working-directory: complete

    # - name: Build with Maven
    #   run: |
    #     cd complete
    #     mvn clean package
    # - name: Run Jar file
    #   run: |
    #   cd complete
    #    java -jar target/*.jar & sleep 20
    #    curl http://localhost:8080
      - name: upload output
        uses: actions/upload-artifact@v4
        with:
          name: rest-output
          path: compleete/output.txt