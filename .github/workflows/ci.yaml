name: java

on:
  push:
    branches:
      - dev

jobs:
  # Build JOB
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [17,21,25]
        distribution: [temurin, zulu, microsoft]
    steps:
      - name: checkout the code
        uses: actions/checkout@v4

      - name: setup java
        uses: actions/setup-java@v4
        with:
          distribution: ${{ matrix.distribution }}
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build package
        run: mvn clean package
        working-directory: ${{ vars.APP_DIR }}

    # - name: Run app and test API
    #  run: |
    #     cd complete
    #     java -jar target/*.jar &
    #     sleep 20
    #     curl http://localhost:8080 > output.txt

    #  - name: Upload REST output
    #   uses: actions/upload-artifact@v4
    #   with:
    #     name: rest-output-${{ matrix.java }}-${{matrix.distribution}}
    #     path: complete/output.txt

      - name: Upload JAR file
        uses: actions/upload-artifact@v4
        with:
          name: ${{ vars.ARTIFACT_NAME }}-${{ matrix.java }}-${{ matrix.distribution }}
          path: ${{ vars.APP_DIR }}/target/*.jar
    # Deploy Job
  deploy:
    runs-on: ubuntu-latest
    needs: build
    # condition using var
    if: vars.DEPLOY_ENABLED ==  'true'

    steps:
      - name: Download artifact (java-21 stable)
        uses: actions/download-artifact@v4
        with:
          name: spring-boot-jar-21-temurin
      - name: show files
        run: ls -la
      - name: Deploy Step
        run: java -jar *.jar
